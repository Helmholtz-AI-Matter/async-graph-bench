name: Run Unit Tests

# Notes on the pinned runner image, the vLLM CPU executable-stack patch, and
# the slow-test selection are in .github/workflows/README.md.

on:
  pull_request:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install uv
          uv pip install --system \
            --extra-index-url https://wheels.vllm.ai/0.27.1/cpu \
            --torch-backend cpu \
            -e ".[dev]"

      - name: Cache Hugging Face models
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: ${{ runner.os }}-huggingface-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-huggingface-

      # The fast suite excludes tests/test_vllm_model_integration.py because its
      # non-slow tests also start a vLLM engine and are expensive. The slow suite
      # below runs that file's @pytest.mark.slow tests.
      - name: Run unit tests
        run: pytest -m "not slow" --ignore=tests/test_vllm_model_integration.py

      # Required on Ubuntu 26.04+ (glibc >= 2.41); see .github/workflows/README.md.
      - name: Make vLLM CPU extension loadable
        if: (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && matrix.python-version == '3.12'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y patchelf
          SITE="$(python -c 'import pathlib, vllm; print(pathlib.Path(vllm.__file__).parent)')"
          python .github/workflows/patch_vllm_execstack.py "$SITE"

      # Do not ignore tests/test_vllm_model_integration.py here: its slow tests
      # are the only `slow` markers under tests/.
      - name: Run slow integration tests
        if: (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && matrix.python-version == '3.12'
        run: pytest -m slow
        env:
          HF_HUB_CACHE: ~/.cache/huggingface

  examples-fast:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        example:
          - min_working_example
          - random_number
          - multi_resource_test
          - resource_benchmark
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Create example virtual environment
        run: |          
          python -m pip install uv
          uv venv examples/${{ matrix.example }}/.venv --python "$(which python)"

      - name: Install package and example test dependencies
        run: |
          uv pip install \
            --python examples/${{ matrix.example }}/.venv/bin/python \
            -e .
          if [ -f "examples/${{ matrix.example }}/requirements.txt" ]; then
            uv pip install \
              --python examples/${{ matrix.example }}/.venv/bin/python \
              -r "examples/${{ matrix.example }}/requirements.txt"
          fi
          uv pip install \
            --python examples/${{ matrix.example }}/.venv/bin/python \
            pytest pytest-asyncio

      - name: Run fast example tests
        run: examples/${{ matrix.example }}/.venv/bin/pytest examples/${{ matrix.example }}/tests -m "not slow"

  examples-slow:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        example:
          - min_working_example
          - random_number
          - multi_resource_test
          - resource_benchmark
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Create example virtual environment
        run: |          
          python -m pip install uv
          uv venv examples/${{ matrix.example }}/.venv --python "$(which python)"

      - name: Install Graphviz
        if: matrix.example == 'min_working_example'
        run: sudo apt-get update && sudo apt-get install --no-install-recommends graphviz

      - name: Install package and slow-test dependencies
        run: |
          if [[ "${{ matrix.example }}" == "min_working_example" ]]; then
            uv pip install \
              --python examples/${{ matrix.example }}/.venv/bin/python \
              -e . pytest pytest-asyncio
          else
            uv pip install \
              --python examples/${{ matrix.example }}/.venv/bin/python \
              --extra-index-url https://wheels.vllm.ai/0.27.1/cpu \
              --torch-backend cpu \
              -e ".[dev]"
            uv pip install \
              --python examples/${{ matrix.example }}/.venv/bin/python \
              -r "examples/${{ matrix.example }}/requirements.txt"
          fi

      # Required on Ubuntu 26.04+ (glibc >= 2.41); see .github/workflows/README.md.
      - name: Make vLLM CPU extension loadable
        run: |
          PYTHON="examples/${{ matrix.example }}/.venv/bin/python"
          if ! "$PYTHON" -c 'import vllm' 2>/dev/null; then
            echo "vLLM is not installed for ${{ matrix.example }}; nothing to patch."
            exit 0
          fi
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y patchelf
          SITE="$("$PYTHON" -c 'import pathlib, vllm; print(pathlib.Path(vllm.__file__).parent)')"
          "$PYTHON" .github/workflows/patch_vllm_execstack.py "$SITE"

      - name: Run slow example tests
        run: examples/${{ matrix.example }}/.venv/bin/pytest examples/${{ matrix.example }}/tests -m slow
        env:
          HF_HUB_CACHE: ~/.cache/huggingface
