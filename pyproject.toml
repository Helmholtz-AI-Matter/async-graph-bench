[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "async-graph-bench"
version = "0.1.0"
authors = []
description = "A benchmarking toolkit for executing calculations within an asynchronous computation graph."
readme = "README.md"

keywords = ["benchmark", "reproducibility", "performance", "async", "workflow", "computation-graph", "scientific-computing", "evaluation", "profiling", "large language models"]
license = { file = "LICENSE.md" }

requires-python = ">=3.11"
dependencies = [
    "async_graph_data_flow==1.6.0",
    "bitarray==3.3.0",
    "diskcache==5.6.3",
    "graphviz==0.20.3",
    "msgpack_python==0.5.6",
    "numpy<1.28",
    "pandas==2.3.2",
    "tqdm==4.67.1",
    "zstd==1.5.6.2",
    "aioprocessing",
    "cachetools",
]

classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Testing :: Benchmark",
]

[project.urls]
#"Homepage" = "https://github.com/muelphil/async_graph_bench"
#"Bug Tracker" = "https://github.com/muelphil/async_graph_bench/issues"
#"Repository" = "https://github.com/muelphil/async_graph_bench"

[project.optional-dependencies]
vllm = ["vllm>0.19"]
# remote-vllm = ["aiohttp>=3.13.3,<4"]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.9",
    "vllm>0.19",
]
docs = [
    "sphinx",
    "myst-parser",
    "sphinx-external-toc",
    "sphinx-autodoc-typehints",
    "sphinx-rtd-theme",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = ["slow: mark test as slow"]
